<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tabata & Run Tracker</title>
  <style>
    :root {
      --bg-idle: #121212;
      --bg-prep: #d97706;
      --bg-work: #dc2626;
      --bg-rest: #059669;
      --bg-done: #2563eb;
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-idle);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 18px;
      transition: background-color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: env(safe-area-inset-top);
    }

    .header-center {
      text-align: center;
      flex: 1;
    }

    .status-badge {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .set-indicator {
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-display {
      text-align: center;
      margin: 4px 0;
    }

    .exercise-banner {
      font-size: 1.55rem;
      font-weight: 800;
      min-height: 2.1rem;
      margin-bottom: 2px;
      padding: 0 6px;
      word-break: break-word;
    }

    .next-banner {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.85;
      min-height: 1.3rem;
      margin-bottom: 4px;
    }

    .time-left {
      font-size: 5.8rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 60dvh;
      overflow-y: auto;
    }

    .settings-container.hidden {
      display: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 12px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.74rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* プリセット & AI行 */
    .preset-row {
      display: flex;
      gap: 6px;
    }

    .preset-row select, .preset-row input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 0;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset-btn.danger {
      background: rgba(239, 68, 68, 0.35);
    }

    .preset-btn.ai-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }

    .preset-btn.ai-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ai-reason-box {
      margin-top: 6px;
      font-size: 0.76rem;
      line-height: 1.4;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 8px;
      padding: 6px 8px;
      display: none;
    }

    .api-key-panel {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: none;
    }

    .api-key-panel.open {
      display: block;
    }

    /* 数値入力グリッド */
    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .metric-box label {
      font-size: 0.68rem;
      opacity: 0.85;
      font-weight: 700;
      text-align: center;
    }

    .metric-box input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 6px 2px;
      width: 100%;
      text-align: center;
    }

    /* 選択済みキュー（1セットの順番リスト） */
    .queue-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 8px;
      min-height: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .queue-tag {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .queue-tag span {
      opacity: 0.75;
      font-size: 0.75rem;
    }

    /* 種目追加パレット */
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-chip {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ex-chip:active {
      background: #dc2626;
      transform: scale(0.95);
    }

    .small-action-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 4px 9px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      gap: 12px;
      padding-bottom: env(safe-area-inset-bottom);
      margin-top: 8px;
    }

    .main-btn {
      flex: 1;
      padding: 15px;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #121212;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .info-bar {
      text-align: center;
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 5px;
    }

    /* 履歴モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      flex-direction: column;
      padding: 18px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-top: env(safe-area-inset-top);
    }

    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .summary-label {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .summary-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .history-meta {
      font-size: 0.76rem;
      opacity: 0.75;
      display: flex;
      justify-content: space-between;
    }

    .history-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-run { background: rgba(16, 185, 129, 0.3); color: #6ee7b7; }
    .badge-weight { background: rgba(245, 158, 11, 0.3); color: #fcd34d; }
    .badge-tabata { background: rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .history-exercises {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .history-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .load-history-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .del-history-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ccc;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div style="width: 60px;"></div>
    <div class="header-center">
      <div class="status-badge" id="statusLabel">READY</div>
      <div class="set-indicator" id="setLabel">SET 0 / 3 ・ 0 / 3回</div>
    </div>
    <button class="icon-btn" id="openHistoryBtn">履歴</button>
  </header>

  <main class="timer-display">
    <div class="exercise-banner" id="exerciseBanner">準備（アップ）</div>
    <div class="next-banner" id="nextBanner"></div>
    <div class="time-left" id="timeDisplay">5</div>
  </main>

  <section class="settings-container" id="settingsPanel">
    <!-- AIメニュー自動提案 -->
    <div class="card">
      <div class="card-title">
        <span>✨ AIトレーナーメニュー提案</span>
        <button class="small-action-btn" id="toggleApiKeyBtn">🔑 API設定</button>
      </div>
      <div class="preset-row">
        <select id="aiFocusSelect" aria-label="今日のテーマ">
          <option value="全身の脂肪燃焼と心肺強化（王道タバタ・20秒/10秒×4種目×2セット）">🔥 王道脂肪燃焼（20s/10s×2周）</option>
          <option value="膝や足首への着地衝撃を抑えた低衝撃メニュー（ジャンプなし・プランクやスクワット系中心）">🦵 膝・関節に優しく（低衝撃）</option>
          <option value="体幹・腹筋・インナーマッスルを徹底的に追い込むメニュー">💪 体幹・腹筋メイン</option>
          <option value="ランニング前の神経系刺激とスプリント持久力を高める高強度メニュー">⚡ スプリント・心肺追い込み</option>
        </select>
        <button class="preset-btn ai-btn" id="generateAiMenuBtn">AI生成</button>
      </div>
      <div class="ai-reason-box" id="aiReasonBox"></div>

      <!-- APIキー入力パネル（初期は非表示、未設定時のみ展開） -->
      <div class="api-key-panel" id="apiKeyPanel">
        <div class="card-title" style="margin-bottom:4px;">
          <span>Gemini API Key（ブラウザ内にのみ保存）</span>
          <span id="apiKeyStatusBadge" style="color:#6ee7b7;"></span>
        </div>
        <div class="preset-row">
          <input type="password" id="geminiApiKeyInput" placeholder="AIzaSy... を貼り付け">
          <button class="preset-btn" id="saveApiKeyBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- プリセット -->
    <div class="card">
      <div class="preset-row">
        <select id="presetSelect" aria-label="プリセット選択"></select>
        <button class="preset-btn" id="savePresetBtn">保存</button>
        <button class="preset-btn danger" id="deletePresetBtn">削除</button>
      </div>
    </div>

    <!-- 秒数＆セット数（4列） -->
    <div class="card">
      <div class="grid-4">
        <div class="metric-box">
          <label for="prepSecInput">PREP (秒)</label>
          <input type="number" id="prepSecInput" value="5" min="0" max="300" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="workSecInput">WORK (秒)</label>
          <input type="number" id="workSecInput" value="10" min="1" max="600" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="restSecInput">REST (秒)</label>
          <input type="number" id="restSecInput" value="5" min="0" max="600" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="setsInput">セット数</label>
          <input type="number" id="setsInput" value="3" min="1" max="99" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- 1セットの種目順番（重複OK・タップ追加） -->
    <div class="card">
      <div class="card-title">
        <span id="sequenceCountLabel">1セットの構成（3種目・タップで削除）</span>
        <button class="small-action-btn" id="clearSeqBtn">クリア</button>
      </div>
      <div class="queue-box" id="selectedQueueBox"></div>

      <div class="card-title" style="margin-top:4px;">
        <span>種目をタップして追加（何回でも重複可）</span>
        <button class="small-action-btn" id="addCustomExBtn">+ 新規種目</button>
      </div>
      <div class="chip-container" id="exercisePalette"></div>
    </div>

    <!-- ラン距離・体重（記録用） -->
    <div class="card">
      <div class="grid-2">
        <div class="metric-box">
          <label for="runDistInput">今日のラン距離 (km)</label>
          <input type="number" id="runDistInput" step="0.1" min="0" max="100" placeholder="例: 4.0" inputmode="decimal">
        </div>
        <div class="metric-box">
          <label for="weightInput">今日の体重 (kg)</label>
          <input type="number" id="weightInput" step="0.1" min="30" max="200" placeholder="例: 79.5" inputmode="decimal">
        </div>
      </div>
    </div>
  </section>

  <div>
    <div class="controls">
      <button class="main-btn btn-primary" id="startPauseBtn">START</button>
      <button class="main-btn btn-secondary" id="resetBtn">RESET</button>
    </div>
    <div class="info-bar" id="wakeLockStatus">画面常時点灯: 待機中</div>
  </div>

  <!-- 履歴モーダル -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-header">
      <h2>トレーニング＆体重記録</h2>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" style="background:#059669;" id="logRunOnlyBtn">+ ランのみ記録</button>
        <button class="icon-btn" id="closeHistoryBtn">閉じる</button>
      </div>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-label">今月の累計ラン距離</div>
        <div class="summary-value" id="monthlyRunSummary">0.0 km</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">最新体重（初回比）</div>
        <div class="summary-value" id="weightSummary">-- kg</div>
      </div>
    </div>

    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const body = document.body;
    const statusLabel = document.getElementById('statusLabel');
    const setLabel = document.getElementById('setLabel');
    const exerciseBanner = document.getElementById('exerciseBanner');
    const nextBanner = document.getElementById('nextBanner');
    const timeDisplay = document.getElementById('timeDisplay');
    const settingsPanel = document.getElementById('settingsPanel');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wakeLockStatus = document.getElementById('wakeLockStatus');

    const prepSecInput = document.getElementById('prepSecInput');
    const workSecInput = document.getElementById('workSecInput');
    const restSecInput = document.getElementById('restSecInput');
    const setsInput = document.getElementById('setsInput');
    const runDistInput = document.getElementById('runDistInput');
    const weightInput = document.getElementById('weightInput');

    const sequenceCountLabel = document.getElementById('sequenceCountLabel');
    const selectedQueueBox = document.getElementById('selectedQueueBox');
    const clearSeqBtn = document.getElementById('clearSeqBtn');
    const exercisePalette = document.getElementById('exercisePalette');
    const addCustomExBtn = document.getElementById('addCustomExBtn');

    const presetSelect = document.getElementById('presetSelect');
    const savePresetBtn = document.getElementById('savePresetBtn');
    const deletePresetBtn = document.getElementById('deletePresetBtn');

    // AI関連要素
    const aiFocusSelect = document.getElementById('aiFocusSelect');
    const generateAiMenuBtn = document.getElementById('generateAiMenuBtn');
    const aiReasonBox = document.getElementById('aiReasonBox');
    const toggleApiKeyBtn = document.getElementById('toggleApiKeyBtn');
    const apiKeyPanel = document.getElementById('apiKeyPanel');
    const geminiApiKeyInput = document.getElementById('geminiApiKeyInput');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
    const apiKeyStatusBadge = document.getElementById('apiKeyStatusBadge');

    const openHistoryBtn = document.getElementById('openHistoryBtn');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const logRunOnlyBtn = document.getElementById('logRunOnlyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const monthlyRunSummary = document.getElementById('monthlyRunSummary');
    const weightSummary = document.getElementById('weightSummary');

    const KEY_CURRENT = 'tabata_seq_current_v5';
    const KEY_EX_LIST = 'tabata_seq_exlist_v5';
    const KEY_PRESETS = 'tabata_seq_presets_v5';
    const KEY_HISTORY = 'tabata_seq_history_v5';
    const KEY_GEMINI_API = 'tabata_gemini_api_key_v1';

    let availableExercises = [
      'ダッシュ',
      'バーピー',
      'バーピーブロードジャンプ',
      'スケータージャンプ',
      'ジャンピングランジ',
      'マウンテンクライマー',
      'プランクジャック',
      'スクワットジャンプ'
    ];
    let selectedSequence = ['ダッシュ', 'バーピー', 'ダッシュ'];

    let executionQueue = [];
    let currentIndex = 0;
    let isRunning = false;
    let phaseEndTime = 0;
    let remainingWhenPaused = 0;
    let lastSpokenSecond = null;
    let timerInterval = null;
    let wakeLock = null;

    // --- Gemini APIキー管理 ---
    function initApiKeyUI() {
      const savedKey = localStorage.getItem(KEY_GEMINI_API) || '';
      geminiApiKeyInput.value = savedKey;
      if (savedKey) {
        apiKeyStatusBadge.textContent = '✓ 保存済';
        apiKeyPanel.classList.remove('open');
      } else {
        apiKeyStatusBadge.textContent = '未設定';
        apiKeyPanel.classList.add('open');
      }
    }

    toggleApiKeyBtn.addEventListener('click', () => {
      apiKeyPanel.classList.toggle('open');
    });

    saveApiKeyBtn.addEventListener('click', () => {
      const key = geminiApiKeyInput.value.trim();
      if (!key) {
        localStorage.removeItem(KEY_GEMINI_API);
        apiKeyStatusBadge.textContent = '未設定';
        alert('APIキーを削除しました。');
        return;
      }
      localStorage.setItem(KEY_GEMINI_API, key);
      apiKeyStatusBadge.textContent = '✓ 保存済';
      apiKeyPanel.classList.remove('open');
      alert('Gemini APIキーをブラウザに保存しました。');
    });

    // --- Gemini API メニュー生成 ---
    async function generateMenuWithGemini() {
      const apiKey = localStorage.getItem(KEY_GEMINI_API);
      if (!apiKey) {
        apiKeyPanel.classList.add('open');
        alert('先に「Gemini API Key」を入力して保存してください。');
        return;
      }

      const focusTheme = aiFocusSelect.value;
      const recentHistory = getHistory()
        .filter(h => !h.isRunOnly && h.config && Array.isArray(h.config.sequence))
        .slice(0, 3)
        .map(h => `${h.date}: ${h.config.sequence.join('→')}`)
        .join(' / ');

      const promptText = `あなたはプロのS&C（ストレングス＆コンディショニング）コーチです。
体重約80kg・1ヶ月で3kg減量を目指すランナー向けに、本日のタバタ式トレーニングメニューを1つ作成してください。

【今日のテーマ】
${focusTheme}

【直近の実施履歴（同じ種目ばかり連続しないよう変化をつけること）】
${recentHistory || '履歴なし'}

【既存種目リスト（これらを活用しつつ、必要なら音声読み上げしやすい短い日本語種目名を新規提案してもよい）】
${availableExercises.join('、')}

【出力ルール】
・1セットあたり4種目〜8種目（通常タバタなら4種目を2セット、または8種目を1セットなど）で構成すること。
・音声読み上げ（speechSynthesis）で聞いてすぐ動作がわかる短く明確な日本語の種目名にすること（例：「ハイニー」「バイシクルクランチ」「プッシュアップ」「スロースクワット」等）。
・以下のJSONスキーマに厳密に従って出力すること。`;

      generateAiMenuBtn.disabled = true;
      generateAiMenuBtn.textContent = '生成中...';
      aiReasonBox.style.display = 'none';

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: {
                responseMimeType: 'application/json',
                responseSchema: {
                  type: 'OBJECT',
                  properties: {
                    prepSec: { type: 'INTEGER', description: '準備時間（秒）。通常5〜10' },
                    workSec: { type: 'INTEGER', description: '運動時間（秒）。通常15〜20' },
                    restSec: { type: 'INTEGER', description: '休憩時間（秒）。通常5〜15' },
                    sets: { type: 'INTEGER', description: 'セット数。1〜4' },
                    sequence: {
                      type: 'ARRAY',
                      items: { type: 'STRING' },
                      description: '1セット内の種目名の順番配列（4〜8個）'
                    },
                    coachNote: {
                      type: 'STRING',
                      description: '今日のメニューの狙いとフォームのワンポイントアドバイス（60文字以内）'
                    }
                  },
                  required: ['prepSec', 'workSec', 'restSec', 'sets', 'sequence', 'coachNote']
                }
              }
            })
          }
        );

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTPエラー: ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('AIからの応答が空でした。');

        const menu = JSON.parse(rawText);
        if (!Array.isArray(menu.sequence) || menu.sequence.length === 0) {
          throw new Error('種目リストの生成に失敗しました。');
        }

        applyConfig({
          prepSec: menu.prepSec,
          workSec: menu.workSec,
          restSec: menu.restSec,
          sets: menu.sets,
          sequence: menu.sequence
        }, false);

        presetSelect.value = '';
        aiReasonBox.textContent = `💡 ${menu.coachNote}`;
        aiReasonBox.style.display = 'block';
      } catch (err) {
        alert(`メニュー生成エラー:\n${err.message}\n\nAPIキーが正しいか、通信環境をご確認ください。`);
      } finally {
        generateAiMenuBtn.disabled = false;
        generateAiMenuBtn.textContent = 'AI生成';
      }
    }

    generateAiMenuBtn.addEventListener('click', generateMenuWithGemini);

    function setupAudioSession() {
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.2;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLockStatus.textContent = '画面常時点灯: ON';
          wakeLock.addEventListener('release', () => {
            wakeLockStatus.textContent = '画面常時点灯: OFF';
          });
        } catch (err) {
          wakeLockStatus.textContent = '画面常時点灯: 制限中';
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
        await requestWakeLock();
      }
    });

    function loadExerciseList() {
      const saved = localStorage.getItem(KEY_EX_LIST);
      if (saved) {
        try { availableExercises = JSON.parse(saved); } catch (e) {}
      }
    }

    function saveExerciseList() {
      localStorage.setItem(KEY_EX_LIST, JSON.stringify(availableExercises));
    }

    // 選択済み順番キューとパレットの描画
    function renderSequenceUI() {
      sequenceCountLabel.textContent = `1セットの構成（${selectedSequence.length}回・タップで削除）`;
      selectedQueueBox.innerHTML = '';

      if (selectedSequence.length === 0) {
        selectedQueueBox.innerHTML = '<span style="font-size:0.76rem; opacity:0.6;">下の種目をタップして追加してください</span>';
      } else {
        selectedSequence.forEach((ex, index) => {
          const tag = document.createElement('button');
          tag.type = 'button';
          tag.className = 'queue-tag';
          tag.innerHTML = `${index + 1}. ${ex} <span>×</span>`;
          tag.addEventListener('click', () => {
            selectedSequence.splice(index, 1);
            renderSequenceUI();
            saveCurrentConfig();
            updateIdleDisplay();
          });
          selectedQueueBox.appendChild(tag);
        });
      }

      exercisePalette.innerHTML = '';
      availableExercises.forEach(ex => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ex-chip';
        btn.textContent = `+ ${ex}`;
        btn.addEventListener('click', () => {
          selectedSequence.push(ex);
          renderSequenceUI();
          saveCurrentConfig();
          updateIdleDisplay();
        });
        exercisePalette.appendChild(btn);
      });
    }

    clearSeqBtn.addEventListener('click', () => {
      selectedSequence = [];
      renderSequenceUI();
      saveCurrentConfig();
      updateIdleDisplay();
    });

    addCustomExBtn.addEventListener('click', () => {
      const name = prompt('追加する種目名を入力してください（例：シャトルラン）');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (!availableExercises.includes(trimmed)) {
        availableExercises.push(trimmed);
        saveExerciseList();
      }
      selectedSequence.push(trimmed);
      renderSequenceUI();
      saveCurrentConfig();
      updateIdleDisplay();
    });

    // キュー構築
    function buildFullQueue() {
      const prepSec = parseInt(prepSecInput.value, 10) || 0;
      const workSec = Math.max(1, parseInt(workSecInput.value, 10) || 10);
      const restSec = parseInt(restSecInput.value, 10) || 0;
      const sets = Math.max(1, parseInt(setsInput.value, 10) || 1);

      const seq = selectedSequence.length > 0 ? selectedSequence : ['全力運動'];
      const reps = seq.length;
      const queue = [];

      for (let s = 1; s <= sets; s++) {
        if (prepSec > 0) {
          queue.push({
            type: 'prep',
            name: s === 1 ? '準備（アップ）' : `第${s}セット準備`,
            sec: prepSec,
            setNum: s,
            totalSets: sets,
            repNum: 0,
            totalReps: reps
          });
        }

        for (let r = 1; r <= reps; r++) {
          const exName = seq[r - 1];
          queue.push({
            type: 'work',
            name: exName,
            sec: workSec,
            setNum: s,
            totalSets: sets,
            repNum: r,
            totalReps: reps
          });

          const isVeryLast = (s === sets && r === reps);
          if (restSec > 0 && !isVeryLast) {
            queue.push({
              type: 'rest',
              name: 'レスト',
              sec: restSec,
              setNum: s,
              totalSets: sets,
              repNum: r,
              totalReps: reps
            });
          }
        }
      }
      return queue;
    }

    function getCurrentConfig() {
      return {
        prepSec: parseInt(prepSecInput.value, 10) || 0,
        workSec: parseInt(workSecInput.value, 10) || 10,
        restSec: parseInt(restSecInput.value, 10) || 5,
        sets: parseInt(setsInput.value, 10) || 3,
        sequence: [...selectedSequence],
        runDist: runDistInput.value,
        weight: weightInput.value
      };
    }

    function applyConfig(cfg, includeMetrics = true) {
      prepSecInput.value = cfg.prepSec ?? 5;
      workSecInput.value = cfg.workSec ?? 10;
      restSecInput.value = cfg.restSec ?? 5;
      setsInput.value = cfg.sets ?? 3;
      if (Array.isArray(cfg.sequence)) {
        cfg.sequence.forEach(ex => {
          if (!availableExercises.includes(ex)) availableExercises.push(ex);
        });
        saveExerciseList();
        selectedSequence = [...cfg.sequence];
      }
      if (includeMetrics) {
        if (cfg.runDist !== undefined) runDistInput.value = cfg.runDist;
        if (cfg.weight !== undefined) weightInput.value = cfg.weight;
      }
      renderSequenceUI();
      saveCurrentConfig();
      updateIdleDisplay();
    }

    function saveCurrentConfig() {
      localStorage.setItem(KEY_CURRENT, JSON.stringify(getCurrentConfig()));
    }

    function loadCurrentConfig() {
      const raw = localStorage.getItem(KEY_CURRENT);
      if (raw) {
        try {
          applyConfig(JSON.parse(raw), true);
          return;
        } catch (e) {}
      }
      renderSequenceUI();
      updateIdleDisplay();
    }

    function updateIdleDisplay() {
      if (isRunning) return;
      const queue = buildFullQueue();
      const sets = Math.max(1, parseInt(setsInput.value, 10) || 1);
      const reps = Math.max(1, selectedSequence.length);
      setLabel.textContent = `SET 0 / ${sets} ・ 0 / ${reps}回`;

      if (queue.length > 0) {
        exerciseBanner.textContent = queue[0].name;
        timeDisplay.textContent = queue[0].sec;
        nextBanner.textContent = queue.length > 1 ? `次: ${queue[1].name} (${queue[1].sec}秒)` : '';
      }
    }

    [prepSecInput, workSecInput, restSecInput, setsInput, runDistInput, weightInput].forEach(el => {
      el.addEventListener('input', () => {
        saveCurrentConfig();
        updateIdleDisplay();
      });
    });

    // プリセット管理
    function getPresets() {
      const raw = localStorage.getItem(KEY_PRESETS);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      return [
        {
          id: 'dash_burpee_dash',
          name: 'ダッシュ→バーピー→ダッシュ (10s/5s ×3セット)',
          prepSec: 5, workSec: 10, restSec: 5, sets: 3,
          sequence: ['ダッシュ', 'バーピー', 'ダッシュ']
        },
        {
          id: 'day_a',
          name: 'Day A: HYROX＆ホッケー全身パワー (4周)',
          prepSec: 10, workSec: 20, restSec: 10, sets: 4,
          sequence: ['バーピーブロードジャンプ', 'スケータージャンプ']
        },
        {
          id: 'day_b',
          name: 'Day B: スプリント＆脚筋持久力 (15s/15s ×4周)',
          prepSec: 10, workSec: 15, restSec: 15, sets: 4,
          sequence: ['ダッシュ', 'ジャンピングランジ']
        },
        {
          id: 'day_c',
          name: 'Day C: 低衝撃・体幹＆脂肪燃焼 (4周)',
          prepSec: 10, workSec: 20, restSec: 10, sets: 4,
          sequence: ['マウンテンクライマー', 'プランクジャック']
        }
      ];
    }

    function savePresets(list) {
      localStorage.setItem(KEY_PRESETS, JSON.stringify(list));
    }

    function renderPresetSelect(selectedId = null) {
      const presets = getPresets();
      presetSelect.innerHTML = '<option value="">-- プリセットから選択 --</option>';
      presets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        if (p.id === selectedId) opt.selected = true;
        presetSelect.appendChild(opt);
      });
    }

    presetSelect.addEventListener('change', () => {
      const found = getPresets().find(p => p.id === presetSelect.value);
      if (found) applyConfig(found, false);
    });

    savePresetBtn.addEventListener('click', () => {
      const name = prompt('プリセット名を入力してください');
      if (!name || !name.trim()) return;
      const presets = getPresets();
      const cfg = getCurrentConfig();
      const newPreset = {
        id: 'preset_' + Date.now(),
        name: name.trim(),
        prepSec: cfg.prepSec,
        workSec: cfg.workSec,
        restSec: cfg.restSec,
        sets: cfg.sets,
        sequence: cfg.sequence
      };
      presets.push(newPreset);
      savePresets(presets);
      renderPresetSelect(newPreset.id);
    });

    deletePresetBtn.addEventListener('click', () => {
      const id = presetSelect.value;
      if (!id) return alert('削除するプリセットを選択してください。');
      if (!confirm('選択中のプリセットを削除しますか？')) return;
      savePresets(getPresets().filter(p => p.id !== id));
      renderPresetSelect();
    });

    // 履歴管理
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch (e) { return []; }
    }

    function saveHistoryList(list) {
      localStorage.setItem(KEY_HISTORY, JSON.stringify(list.slice(0, 100)));
    }

    function recordHistory(queue, isRunOnly = false) {
      const now = new Date();
      const totalSec = isRunOnly ? 0 : queue.reduce((acc, item) => acc + item.sec, 0);
      const cfg = getCurrentConfig();
      const distVal = parseFloat(cfg.runDist);
      const weightVal = parseFloat(cfg.weight);

      const entry = {
        id: Date.now(),
        timestamp: now.getTime(),
        yearMonth: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`,
        date: now.toLocaleString('ja-JP', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }),
        isRunOnly,
        totalSec,
        runDist: !isNaN(distVal) && distVal > 0 ? distVal : null,
        weight: !isNaN(weightVal) && weightVal > 0 ? weightVal : null,
        config: cfg
      };

      const history = getHistory();
      history.unshift(entry);
      saveHistoryList(history);

      runDistInput.value = '';
      saveCurrentConfig();
    }

    logRunOnlyBtn.addEventListener('click', () => {
      const distVal = parseFloat(runDistInput.value);
      const weightVal = parseFloat(weightInput.value);
      if ((isNaN(distVal) || distVal <= 0) && (isNaN(weightVal) || weightVal <= 0)) {
        alert('メイン画面の「今日のラン距離」または「今日の体重」に数値を入力してから押してください。');
        return;
      }
      recordHistory([], true);
      renderHistoryModal();
    });

    function renderHistoryModal() {
      const history = getHistory();
      const now = new Date();
      const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      const monthlyKm = history
        .filter(h => h.yearMonth === currentYM && h.runDist)
        .reduce((sum, h) => sum + h.runDist, 0);
      monthlyRunSummary.textContent = `${monthlyKm.toFixed(1)} km`;

      const weightEntries = history.filter(h => h.weight !== null);
      if (weightEntries.length > 0) {
        const latestW = weightEntries[0].weight;
        const oldestW = weightEntries[weightEntries.length - 1].weight;
        const diff = (latestW - oldestW).toFixed(1);
        const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
        weightSummary.textContent = weightEntries.length > 1
          ? `${latestW.toFixed(1)}kg (${diffStr}kg)`
          : `${latestW.toFixed(1)}kg`;
      } else {
        weightSummary.textContent = '-- kg';
      }

      if (history.length === 0) {
        historyList.innerHTML = '<div style="opacity:0.7; text-align:center; margin-top:40px;">まだ記録がありません。</div>';
        return;
      }

      historyList.innerHTML = '';
      history.forEach(item => {
        const min = Math.floor(item.totalSec / 60);
        const sec = item.totalSec % 60;
        const durationStr = min > 0 ? `${min}分${sec}秒` : `${sec}秒`;

        let badgesHtml = '';
        if (item.runDist) badgesHtml += `<span class="badge badge-run">🏃 ラン ${item.runDist} km</span>`;
        if (item.weight) badgesHtml += `<span class="badge badge-weight">⚖️ 体重 ${item.weight} kg</span>`;
        if (!item.isRunOnly) {
          const repCount = item.config.sequence ? item.config.sequence.length : 1;
          badgesHtml += `<span class="badge badge-tabata">🔥 ${repCount}回×${item.config.sets}セット (${durationStr})</span>`;
        }

        const exText = item.config.sequence && item.config.sequence.length > 0
          ? item.config.sequence.join(' → ')
          : '種目指定なし';

        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-meta"><span>${item.date}</span></div>
          <div class="history-badges">${badgesHtml}</div>
          ${!item.isRunOnly ? `<div class="history-exercises">Prep ${item.config.prepSec}s / Work ${item.config.workSec}s / Rest ${item.config.restSec}s｜${exText}</div>` : ''}
          <div class="history-actions">
            ${!item.isRunOnly ? `<button class="load-history-btn">この設定を読み込む</button>` : ''}
            <button class="del-history-btn">削除</button>
          </div>
        `;

        const loadBtn = div.querySelector('.load-history-btn');
        if (loadBtn) {
          loadBtn.addEventListener('click', () => {
            if (isRunning) return alert('タイマー実行中は読み込めません。');
            applyConfig(item.config, false);
            presetSelect.value = '';
            historyModal.classList.remove('open');
          });
        }

        div.querySelector('.del-history-btn').addEventListener('click', () => {
          if (!confirm('この履歴を削除しますか？')) return;
          saveHistoryList(getHistory().filter(h => h.id !== item.id));
          renderHistoryModal();
        });

        historyList.appendChild(div);
      });
    }

    openHistoryBtn.addEventListener('click', () => {
      renderHistoryModal();
      historyModal.classList.add('open');
    });

    closeHistoryBtn.addEventListener('click', () => {
      historyModal.classList.remove('open');
    });

    // ステップ実行
    function startStep(index) {
      if (index >= executionQueue.length) {
        isRunning = false;
        clearInterval(timerInterval);
        releaseWakeLock();
        recordHistory(executionQueue, false);

        body.style.backgroundColor = 'var(--bg-done)';
        statusLabel.textContent = 'FINISH';
        exerciseBanner.textContent = 'COMPLETE!';
        nextBanner.textContent = '履歴に自動記録しました';
        timeDisplay.textContent = '0';
        startPauseBtn.textContent = 'START';
        settingsPanel.classList.remove('hidden');
        speak('お疲れ様でした。トレーニング終了です');
        return;
      }

      currentIndex = index;
      lastSpokenSecond = null;
      const step = executionQueue[index];
      const nextStep = executionQueue[index + 1];

      if (step.type === 'prep') {
        body.style.backgroundColor = 'var(--bg-prep)';
        statusLabel.textContent = 'PREPARE';
      } else if (step.type === 'rest') {
        body.style.backgroundColor = 'var(--bg-rest)';
        statusLabel.textContent = 'REST';
      } else {
        body.style.backgroundColor = 'var(--bg-work)';
        statusLabel.textContent = 'WORK';
      }

      const displayRep = step.type === 'prep' ? 0 : step.repNum;
      setLabel.textContent = `SET ${step.setNum} / ${step.totalSets} ・ ${displayRep} / ${step.totalReps}回`;
      exerciseBanner.textContent = step.name;
      nextBanner.textContent = nextStep ? `次: ${nextStep.name} (${nextStep.sec}秒)` : 'これが最後のメニューです';

      let speechText = '';
      if (step.type === 'rest') {
        speechText = nextStep ? `レスト。次は、${nextStep.name}` : 'レスト';
      } else if (step.type === 'prep') {
        speechText = nextStep ? `${step.name}、${step.sec}秒。次は、${nextStep.name}` : `${step.name}、${step.sec}秒`;
      } else {
        const isLastWork = !executionQueue.slice(index + 1).some(s => s.type === 'work');
        speechText = isLastWork ? `ラスト、${step.name}、スタート` : `${step.name}、スタート`;
      }
      speak(speechText);

      phaseEndTime = Date.now() + step.sec * 1000;
      timeDisplay.textContent = step.sec;
    }

    function tick() {
      const now = Date.now();
      const diffMs = phaseEndTime - now;
      const secLeft = Math.ceil(diffMs / 1000);

      if (secLeft > 0) {
        timeDisplay.textContent = secLeft;
        const currentStepSec = executionQueue[currentIndex].sec;
        const countdownStart = Math.min(3, currentStepSec - 1);
        if (secLeft <= countdownStart && secLeft !== lastSpokenSecond) {
          lastSpokenSecond = secLeft;
          if (secLeft === 3) {
            speak('残り3秒');
          } else {
            speak(String(secLeft));
          }
        }
      } else {
        startStep(currentIndex + 1);
      }
    }

    startPauseBtn.addEventListener('click', () => {
      setupAudioSession();

      if (!isRunning) {
        if (remainingWhenPaused === 0) {
          executionQueue = buildFullQueue();
          if (executionQueue.length === 0) {
            alert('種目や秒数を設定してください。');
            return;
          }
          const unlock = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(unlock);
        }

        isRunning = true;
        startPauseBtn.textContent = 'PAUSE';
        settingsPanel.classList.add('hidden');
        requestWakeLock();

        if (remainingWhenPaused > 0) {
          phaseEndTime = Date.now() + remainingWhenPaused;
          remainingWhenPaused = 0;
          speak('再開');
        } else {
          startStep(0);
        }

        timerInterval = setInterval(tick, 100);
      } else {
        isRunning = false;
        clearInterval(timerInterval);
        remainingWhenPaused = phaseEndTime - Date.now();
        startPauseBtn.textContent = 'RESUME';
        releaseWakeLock();
        window.speechSynthesis.cancel();
      }
    });

    resetBtn.addEventListener('click', () => {
      isRunning = false;
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();
      releaseWakeLock();

      currentIndex = 0;
      remainingWhenPaused = 0;
      body.style.backgroundColor = 'var(--bg-idle)';
      statusLabel.textContent = 'READY';
      startPauseBtn.textContent = 'START';
      settingsPanel.classList.remove('hidden');
      updateIdleDisplay();
    });

    // 初期化
    initApiKeyUI();
    loadExerciseList();
    renderPresetSelect();
    loadCurrentConfig();
  </script>
</body>
</html>
