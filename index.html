<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tabata & Run Tracker</title>
  <style>
    :root {
      --bg-idle: #121212;
      --bg-prep: #d97706;
      --bg-work: #dc2626;
      --bg-rest: #059669;
      --bg-done: #2563eb;
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-idle);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 18px;
      transition: background-color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: env(safe-area-inset-top);
    }

    .header-center {
      text-align: center;
      flex: 1;
    }

    .status-badge {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .set-indicator {
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-display {
      text-align: center;
      margin: 4px 0;
    }

    .exercise-banner {
      font-size: 1.55rem;
      font-weight: 800;
      min-height: 2.1rem;
      margin-bottom: 2px;
      padding: 0 6px;
      word-break: break-word;
    }

    .next-banner {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.85;
      min-height: 1.3rem;
      margin-bottom: 4px;
    }

    .time-left {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 58dvh;
      overflow-y: auto;
    }

    .settings-container.hidden {
      display: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 12px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.74rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* プリセット行 */
    .preset-row {
      display: flex;
      gap: 6px;
    }

    .preset-row select {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-btn.danger {
      background: rgba(239, 68, 68, 0.35);
    }

    /* 数値入力グリッド */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .metric-box label {
      font-size: 0.7rem;
      opacity: 0.85;
      font-weight: 700;
      text-align: center;
    }

    .metric-box input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 4px;
      width: 100%;
      text-align: center;
    }

    /* 種目選択チップ */
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ex-chip {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ex-chip.selected {
      background: #dc2626;
      color: #ffffff;
      border-color: #f87171;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
    }

    .add-ex-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .selected-order-preview {
      font-size: 0.74rem;
      opacity: 0.85;
      margin-top: 6px;
      color: #fca5a5;
      font-weight: 600;
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      gap: 12px;
      padding-bottom: env(safe-area-inset-bottom);
      margin-top: 8px;
    }

    .main-btn {
      flex: 1;
      padding: 15px;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #121212;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .info-bar {
      text-align: center;
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 5px;
    }

    /* 履歴モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      flex-direction: column;
      padding: 18px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-top: env(safe-area-inset-top);
    }

    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .summary-label {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .summary-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .history-meta {
      font-size: 0.76rem;
      opacity: 0.75;
      display: flex;
      justify-content: space-between;
    }

    .history-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-run { background: rgba(16, 185, 129, 0.3); color: #6ee7b7; }
    .badge-weight { background: rgba(245, 158, 11, 0.3); color: #fcd34d; }
    .badge-tabata { background: rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .history-exercises {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .history-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .load-history-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .del-history-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ccc;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div style="width: 60px;"></div>
    <div class="header-center">
      <div class="status-badge" id="statusLabel">READY</div>
      <div class="set-indicator" id="setLabel">SET 0 / 3 ・ 0 / 2回</div>
    </div>
    <button class="icon-btn" id="openHistoryBtn">履歴</button>
  </header>

  <main class="timer-display">
    <div class="exercise-banner" id="exerciseBanner">アップ（準備）</div>
    <div class="next-banner" id="nextBanner"></div>
    <div class="time-left" id="timeDisplay">5</div>
  </main>

  <section class="settings-container" id="settingsPanel">
    <!-- プリセット -->
    <div class="card">
      <div class="preset-row">
        <select id="presetSelect" aria-label="プリセット選択"></select>
        <button class="preset-btn" id="savePresetBtn">保存</button>
        <button class="preset-btn danger" id="deletePresetBtn">削除</button>
      </div>
    </div>

    <!-- 秒数設定（PREP / WORK / REST） -->
    <div class="card">
      <div class="grid-3">
        <div class="metric-box">
          <label for="prepSecInput">PREP 準備 (秒)</label>
          <input type="number" id="prepSecInput" value="5" min="0" max="300" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="workSecInput">WORK 運動 (秒)</label>
          <input type="number" id="workSecInput" value="10" min="1" max="600" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="restSecInput">REST 休憩 (秒)</label>
          <input type="number" id="restSecInput" value="5" min="0" max="600" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- 回数・セット数 -->
    <div class="card">
      <div class="grid-2">
        <div class="metric-box">
          <label for="repsInput">1セット内の回数 (回)</label>
          <input type="number" id="repsInput" value="2" min="1" max="99" inputmode="numeric">
        </div>
        <div class="metric-box">
          <label for="setsInput">セット数 (セット)</label>
          <input type="number" id="setsInput" value="3" min="1" max="99" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- WORK 種目選択（タップで複数選択） -->
    <div class="card">
      <div class="card-title">
        <span>WORK 種目（タップで選択・順番にループ）</span>
        <button class="add-ex-btn" id="addCustomExBtn">+ 種目追加</button>
      </div>
      <div class="chip-container" id="exerciseChips"></div>
      <div class="selected-order-preview" id="selectedOrderPreview">選択順: ダッシュ → バーピー</div>
    </div>

    <!-- ラン距離・体重（記録用） -->
    <div class="card">
      <div class="grid-2">
        <div class="metric-box">
          <label for="runDistInput">今日のラン距離 (km)</label>
          <input type="number" id="runDistInput" step="0.1" min="0" max="100" placeholder="例: 4.0" inputmode="decimal">
        </div>
        <div class="metric-box">
          <label for="weightInput">今日の体重 (kg)</label>
          <input type="number" id="weightInput" step="0.1" min="30" max="200" placeholder="例: 79.5" inputmode="decimal">
        </div>
      </div>
    </div>
  </section>

  <div>
    <div class="controls">
      <button class="main-btn btn-primary" id="startPauseBtn">START</button>
      <button class="main-btn btn-secondary" id="resetBtn">RESET</button>
    </div>
    <div class="info-bar" id="wakeLockStatus">画面常時点灯: 待機中</div>
  </div>

  <!-- 履歴モーダル -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-header">
      <h2>トレーニング＆体重記録</h2>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" style="background:#059669;" id="logRunOnlyBtn">+ ランのみ記録</button>
        <button class="icon-btn" id="closeHistoryBtn">閉じる</button>
      </div>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-label">今月の累計ラン距離</div>
        <div class="summary-value" id="monthlyRunSummary">0.0 km</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">最新体重（初回比）</div>
        <div class="summary-value" id="weightSummary">-- kg</div>
      </div>
    </div>

    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const body = document.body;
    const statusLabel = document.getElementById('statusLabel');
    const setLabel = document.getElementById('setLabel');
    const exerciseBanner = document.getElementById('exerciseBanner');
    const nextBanner = document.getElementById('nextBanner');
    const timeDisplay = document.getElementById('timeDisplay');
    const settingsPanel = document.getElementById('settingsPanel');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wakeLockStatus = document.getElementById('wakeLockStatus');

    const prepSecInput = document.getElementById('prepSecInput');
    const workSecInput = document.getElementById('workSecInput');
    const restSecInput = document.getElementById('restSecInput');
    const repsInput = document.getElementById('repsInput');
    const setsInput = document.getElementById('setsInput');
    const runDistInput = document.getElementById('runDistInput');
    const weightInput = document.getElementById('weightInput');

    const exerciseChips = document.getElementById('exerciseChips');
    const addCustomExBtn = document.getElementById('addCustomExBtn');
    const selectedOrderPreview = document.getElementById('selectedOrderPreview');

    const presetSelect = document.getElementById('presetSelect');
    const savePresetBtn = document.getElementById('savePresetBtn');
    const deletePresetBtn = document.getElementById('deletePresetBtn');

    const openHistoryBtn = document.getElementById('openHistoryBtn');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const logRunOnlyBtn = document.getElementById('logRunOnlyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const monthlyRunSummary = document.getElementById('monthlyRunSummary');
    const weightSummary = document.getElementById('weightSummary');

    const KEY_CURRENT = 'tabata_select_current_v4';
    const KEY_EX_LIST = 'tabata_select_exlist_v4';
    const KEY_PRESETS = 'tabata_select_presets_v4';
    const KEY_HISTORY = 'tabata_select_history_v4';

    // 種目マスタと選択中リスト（選択順を保持）
    let availableExercises = [
      'ダッシュ',
      'バーピー',
      'バーピーブロードジャンプ',
      'スケータージャンプ',
      'ジャンピングランジ',
      'マウンテンクライマー',
      'プランクジャック',
      'スクワットジャンプ'
    ];
    let selectedExercises = ['ダッシュ', 'バーピー'];

    let executionQueue = [];
    let currentIndex = 0;
    let isRunning = false;
    let phaseEndTime = 0;
    let remainingWhenPaused = 0;
    let lastSpokenSecond = null;
    let timerInterval = null;
    let wakeLock = null;

    function setupAudioSession() {
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.2;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLockStatus.textContent = '画面常時点灯: ON';
          wakeLock.addEventListener('release', () => {
            wakeLockStatus.textContent = '画面常時点灯: OFF';
          });
        } catch (err) {
          wakeLockStatus.textContent = '画面常時点灯: 制限中';
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
        await requestWakeLock();
      }
    });

    // 種目チップの描画と選択制御
    function loadExerciseList() {
      const saved = localStorage.getItem(KEY_EX_LIST);
      if (saved) {
        try { availableExercises = JSON.parse(saved); } catch (e) {}
      }
    }

    function saveExerciseList() {
      localStorage.setItem(KEY_EX_LIST, JSON.stringify(availableExercises));
    }

    function renderExerciseChips() {
      exerciseChips.innerHTML = '';
      availableExercises.forEach(ex => {
        const idx = selectedExercises.indexOf(ex);
        const isSelected = idx !== -1;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ex-chip' + (isSelected ? ' selected' : '');
        btn.textContent = isSelected ? `${idx + 1}. ${ex}` : ex;

        btn.addEventListener('click', () => {
          const curIdx = selectedExercises.indexOf(ex);
          if (curIdx !== -1) {
            selectedExercises.splice(curIdx, 1);
          } else {
            selectedExercises.push(ex);
          }
          renderExerciseChips();
          saveCurrentConfig();
          updateIdleDisplay();
        });
        exerciseChips.appendChild(btn);
      });

      if (selectedExercises.length > 0) {
        selectedOrderPreview.textContent = `選択順: ${selectedExercises.join(' → ')}`;
      } else {
        selectedOrderPreview.textContent = '※ 種目未選択（一般的な運動としてカウントします）';
      }
    }

    addCustomExBtn.addEventListener('click', () => {
      const name = prompt('追加する種目名を入力してください（例：シャトルラン）');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (!availableExercises.includes(trimmed)) {
        availableExercises.push(trimmed);
        saveExerciseList();
      }
      if (!selectedExercises.includes(trimmed)) {
        selectedExercises.push(trimmed);
      }
      renderExerciseChips();
      saveCurrentConfig();
      updateIdleDisplay();
    });

    // キュー構築（Prep → [Work + Rest] × 回数 を セット数分繰り返す）
    function buildFullQueue() {
      const prepSec = parseInt(prepSecInput.value, 10) || 0;
      const workSec = Math.max(1, parseInt(workSecInput.value, 10) || 20);
      const restSec = parseInt(restSecInput.value, 10) || 0;
      const reps = Math.max(1, parseInt(repsInput.value, 10) || 1);
      const sets = Math.max(1, parseInt(setsInput.value, 10) || 1);

      const queue = [];

      for (let s = 1; s <= sets; s++) {
        // セットごとのPREP（準備）
        if (prepSec > 0) {
          queue.push({
            type: 'prep',
            name: s === 1 ? '準備（アップ）' : `第${s}セット準備`,
            sec: prepSec,
            setNum: s,
            totalSets: sets,
            repNum: 0,
            totalReps: reps
          });
        }

        // 1セット内の回数ループ
        for (let r = 1; r <= reps; r++) {
          const exName = selectedExercises.length > 0
            ? selectedExercises[(r - 1) % selectedExercises.length]
            : '全力運動';

          queue.push({
            type: 'work',
            name: exName,
            sec: workSec,
            setNum: s,
            totalSets: sets,
            repNum: r,
            totalReps: reps
          });

          // 最終セットの最終回の後以外はRESTを入れる
          const isVeryLast = (s === sets && r === reps);
          if (restSec > 0 && !isVeryLast) {
            queue.push({
              type: 'rest',
              name: 'レスト',
              sec: restSec,
              setNum: s,
              totalSets: sets,
              repNum: r,
              totalReps: reps
            });
          }
        }
      }
      return queue;
    }

    function getCurrentConfig() {
      return {
        prepSec: parseInt(prepSecInput.value, 10) || 0,
        workSec: parseInt(workSecInput.value, 10) || 10,
        restSec: parseInt(restSecInput.value, 10) || 5,
        reps: parseInt(repsInput.value, 10) || 2,
        sets: parseInt(setsInput.value, 10) || 3,
        exercises: [...selectedExercises],
        runDist: runDistInput.value,
        weight: weightInput.value
      };
    }

    function applyConfig(cfg, includeMetrics = true) {
      prepSecInput.value = cfg.prepSec ?? 5;
      workSecInput.value = cfg.workSec ?? 10;
      restSecInput.value = cfg.restSec ?? 5;
      repsInput.value = cfg.reps ?? 2;
      setsInput.value = cfg.sets ?? 3;
      if (Array.isArray(cfg.exercises)) {
        // マスタにない種目があれば追加
        cfg.exercises.forEach(ex => {
          if (!availableExercises.includes(ex)) availableExercises.push(ex);
        });
        saveExerciseList();
        selectedExercises = [...cfg.exercises];
      }
      if (includeMetrics) {
        if (cfg.runDist !== undefined) runDistInput.value = cfg.runDist;
        if (cfg.weight !== undefined) weightInput.value = cfg.weight;
      }
      renderExerciseChips();
      saveCurrentConfig();
      updateIdleDisplay();
    }

    function saveCurrentConfig() {
      localStorage.setItem(KEY_CURRENT, JSON.stringify(getCurrentConfig()));
    }

    function loadCurrentConfig() {
      const raw = localStorage.getItem(KEY_CURRENT);
      if (raw) {
        try {
          applyConfig(JSON.parse(raw), true);
          return;
        } catch (e) {}
      }
      renderExerciseChips();
      updateIdleDisplay();
    }

    function updateIdleDisplay() {
      if (isRunning) return;
      const queue = buildFullQueue();
      const sets = Math.max(1, parseInt(setsInput.value, 10) || 1);
      const reps = Math.max(1, parseInt(repsInput.value, 10) || 1);
      setLabel.textContent = `SET 0 / ${sets} ・ 0 / ${reps}回`;

      if (queue.length > 0) {
        exerciseBanner.textContent = queue[0].name;
        timeDisplay.textContent = queue[0].sec;
        nextBanner.textContent = queue.length > 1 ? `次: ${queue[1].name} (${queue[1].sec}秒)` : '';
      }
    }

    [prepSecInput, workSecInput, restSecInput, repsInput, setsInput, runDistInput, weightInput].forEach(el => {
      el.addEventListener('input', () => {
        saveCurrentConfig();
        updateIdleDisplay();
      });
    });

    // プリセット管理
    function getPresets() {
      const raw = localStorage.getItem(KEY_PRESETS);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      return [
        {
          id: 'sprint_burpee_3',
          name: 'アップ5s→ダッシュ・バーピー10s×2回 (3セット)',
          prepSec: 5, workSec: 10, restSec: 5, reps: 2, sets: 3,
          exercises: ['ダッシュ', 'バーピー']
        },
        {
          id: 'day_a',
          name: 'Day A: HYROX＆ホッケー全身パワー (8回×1セット)',
          prepSec: 10, workSec: 20, restSec: 10, reps: 8, sets: 1,
          exercises: ['バーピーブロードジャンプ', 'スケータージャンプ']
        },
        {
          id: 'day_b',
          name: 'Day B: スプリント＆脚筋持久力 (15s/15s×8回)',
          prepSec: 10, workSec: 15, restSec: 15, reps: 8, sets: 1,
          exercises: ['ダッシュ', 'ジャンピングランジ']
        },
        {
          id: 'day_c',
          name: 'Day C: 低衝撃・体幹＆脂肪燃焼 (8回×1セット)',
          prepSec: 10, workSec: 20, restSec: 10, reps: 8, sets: 1,
          exercises: ['マウンテンクライマー', 'プランクジャック']
        }
      ];
    }

    function savePresets(list) {
      localStorage.setItem(KEY_PRESETS, JSON.stringify(list));
    }

    function renderPresetSelect(selectedId = null) {
      const presets = getPresets();
      presetSelect.innerHTML = '<option value="">-- プリセットから選択 --</option>';
      presets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        if (p.id === selectedId) opt.selected = true;
        presetSelect.appendChild(opt);
      });
    }

    presetSelect.addEventListener('change', () => {
      const found = getPresets().find(p => p.id === presetSelect.value);
      if (found) applyConfig(found, false);
    });

    savePresetBtn.addEventListener('click', () => {
      const name = prompt('プリセット名を入力してください');
      if (!name || !name.trim()) return;
      const presets = getPresets();
      const cfg = getCurrentConfig();
      const newPreset = {
        id: 'preset_' + Date.now(),
        name: name.trim(),
        prepSec: cfg.prepSec,
        workSec: cfg.workSec,
        restSec: cfg.restSec,
        reps: cfg.reps,
        sets: cfg.sets,
        exercises: cfg.exercises
      };
      presets.push(newPreset);
      savePresets(presets);
      renderPresetSelect(newPreset.id);
    });

    deletePresetBtn.addEventListener('click', () => {
      const id = presetSelect.value;
      if (!id) return alert('削除するプリセットを選択してください。');
      if (!confirm('選択中のプリセットを削除しますか？')) return;
      savePresets(getPresets().filter(p => p.id !== id));
      renderPresetSelect();
    });

    // 履歴管理
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch (e) { return []; }
    }

    function saveHistoryList(list) {
      localStorage.setItem(KEY_HISTORY, JSON.stringify(list.slice(0, 100)));
    }

    function recordHistory(queue, isRunOnly = false) {
      const now = new Date();
      const totalSec = isRunOnly ? 0 : queue.reduce((acc, item) => acc + item.sec, 0);
      const cfg = getCurrentConfig();
      const distVal = parseFloat(cfg.runDist);
      const weightVal = parseFloat(cfg.weight);

      const entry = {
        id: Date.now(),
        timestamp: now.getTime(),
        yearMonth: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`,
        date: now.toLocaleString('ja-JP', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }),
        isRunOnly,
        totalSec,
        runDist: !isNaN(distVal) && distVal > 0 ? distVal : null,
        weight: !isNaN(weightVal) && weightVal > 0 ? weightVal : null,
        config: cfg
      };

      const history = getHistory();
      history.unshift(entry);
      saveHistoryList(history);

      runDistInput.value = '';
      saveCurrentConfig();
    }

    logRunOnlyBtn.addEventListener('click', () => {
      const distVal = parseFloat(runDistInput.value);
      const weightVal = parseFloat(weightInput.value);
      if ((isNaN(distVal) || distVal <= 0) && (isNaN(weightVal) || weightVal <= 0)) {
        alert('メイン画面の「今日のラン距離」または「今日の体重」に数値を入力してから押してください。');
        return;
      }
      recordHistory([], true);
      renderHistoryModal();
    });

    function renderHistoryModal() {
      const history = getHistory();
      const now = new Date();
      const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      const monthlyKm = history
        .filter(h => h.yearMonth === currentYM && h.runDist)
        .reduce((sum, h) => sum + h.runDist, 0);
      monthlyRunSummary.textContent = `${monthlyKm.toFixed(1)} km`;

      const weightEntries = history.filter(h => h.weight !== null);
      if (weightEntries.length > 0) {
        const latestW = weightEntries[0].weight;
        const oldestW = weightEntries[weightEntries.length - 1].weight;
        const diff = (latestW - oldestW).toFixed(1);
        const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
        weightSummary.textContent = weightEntries.length > 1
          ? `${latestW.toFixed(1)}kg (${diffStr}kg)`
          : `${latestW.toFixed(1)}kg`;
      } else {
        weightSummary.textContent = '-- kg';
      }

      if (history.length === 0) {
        historyList.innerHTML = '<div style="opacity:0.7; text-align:center; margin-top:40px;">まだ記録がありません。</div>';
        return;
      }

      historyList.innerHTML = '';
      history.forEach(item => {
        const min = Math.floor(item.totalSec / 60);
        const sec = item.totalSec % 60;
        const durationStr = min > 0 ? `${min}分${sec}秒` : `${sec}秒`;

        let badgesHtml = '';
        if (item.runDist) badgesHtml += `<span class="badge badge-run">🏃 ラン ${item.runDist} km</span>`;
        if (item.weight) badgesHtml += `<span class="badge badge-weight">⚖️ 体重 ${item.weight} kg</span>`;
        if (!item.isRunOnly) {
          badgesHtml += `<span class="badge badge-tabata">🔥 ${item.config.reps}回×${item.config.sets}セット (${durationStr})</span>`;
        }

        const exText = item.config.exercises && item.config.exercises.length > 0
          ? item.config.exercises.join(' → ')
          : '種目指定なし';

        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-meta"><span>${item.date}</span></div>
          <div class="history-badges">${badgesHtml}</div>
          ${!item.isRunOnly ? `<div class="history-exercises">Prep ${item.config.prepSec}s / Work ${item.config.workSec}s / Rest ${item.config.restSec}s｜${exText}</div>` : ''}
          <div class="history-actions">
            ${!item.isRunOnly ? `<button class="load-history-btn">この設定を読み込む</button>` : ''}
            <button class="del-history-btn">削除</button>
          </div>
        `;

        const loadBtn = div.querySelector('.load-history-btn');
        if (loadBtn) {
          loadBtn.addEventListener('click', () => {
            if (isRunning) return alert('タイマー実行中は読み込めません。');
            applyConfig(item.config, false);
            presetSelect.value = '';
            historyModal.classList.remove('open');
          });
        }

        div.querySelector('.del-history-btn').addEventListener('click', () => {
          if (!confirm('この履歴を削除しますか？')) return;
          saveHistoryList(getHistory().filter(h => h.id !== item.id));
          renderHistoryModal();
        });

        historyList.appendChild(div);
      });
    }

    openHistoryBtn.addEventListener('click', () => {
      renderHistoryModal();
      historyModal.classList.add('open');
    });

    closeHistoryBtn.addEventListener('click', () => {
      historyModal.classList.remove('open');
    });

    // ステップ実行
    function startStep(index) {
      if (index >= executionQueue.length) {
        isRunning = false;
        clearInterval(timerInterval);
        releaseWakeLock();
        recordHistory(executionQueue, false);

        body.style.backgroundColor = 'var(--bg-done)';
        statusLabel.textContent = 'FINISH';
        exerciseBanner.textContent = 'COMPLETE!';
        nextBanner.textContent = '履歴に自動記録しました';
        timeDisplay.textContent = '0';
        startPauseBtn.textContent = 'START';
        settingsPanel.classList.remove('hidden');
        speak('お疲れ様でした。トレーニング終了です');
        return;
      }

      currentIndex = index;
      lastSpokenSecond = null;
      const step = executionQueue[index];
      const nextStep = executionQueue[index + 1];

      if (step.type === 'prep') {
        body.style.backgroundColor = 'var(--bg-prep)';
        statusLabel.textContent = 'PREPARE';
      } else if (step.type === 'rest') {
        body.style.backgroundColor = 'var(--bg-rest)';
        statusLabel.textContent = 'REST';
      } else {
        body.style.backgroundColor = 'var(--bg-work)';
        statusLabel.textContent = 'WORK';
      }

      const displayRep = step.type === 'prep' ? 0 : step.repNum;
      setLabel.textContent = `SET ${step.setNum} / ${step.totalSets} ・ ${displayRep} / ${step.totalReps}回`;
      exerciseBanner.textContent = step.name;
      nextBanner.textContent = nextStep ? `次: ${nextStep.name} (${nextStep.sec}秒)` : 'これが最後のメニューです';

      let speechText = '';
      if (step.type === 'rest') {
        speechText = nextStep ? `レスト。次は、${nextStep.name}` : 'レスト';
      } else if (step.type === 'prep') {
        speechText = nextStep ? `${step.name}、${step.sec}秒。次は、${nextStep.name}` : `${step.name}、${step.sec}秒`;
      } else {
        const isLastWork = !executionQueue.slice(index + 1).some(s => s.type === 'work');
        speechText = isLastWork ? `ラスト、${step.name}、スタート` : `${step.name}、スタート`;
      }
      speak(speechText);

      phaseEndTime = Date.now() + step.sec * 1000;
      timeDisplay.textContent = step.sec;
    }

    function tick() {
      const now = Date.now();
      const diffMs = phaseEndTime - now;
      const secLeft = Math.ceil(diffMs / 1000);

      if (secLeft > 0) {
        timeDisplay.textContent = secLeft;
        const currentStepSec = executionQueue[currentIndex].sec;
        const countdownStart = Math.min(3, currentStepSec - 1);
        if (secLeft <= countdownStart && secLeft !== lastSpokenSecond) {
          lastSpokenSecond = secLeft;
          if (secLeft === 3) {
            speak('残り3秒');
          } else {
            speak(String(secLeft));
          }
        }
      } else {
        startStep(currentIndex + 1);
      }
    }

    startPauseBtn.addEventListener('click', () => {
      setupAudioSession();

      if (!isRunning) {
        if (remainingWhenPaused === 0) {
          executionQueue = buildFullQueue();
          if (executionQueue.length === 0) {
            alert('秒数や回数を正しく設定してください。');
            return;
          }
          const unlock = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(unlock);
        }

        isRunning = true;
        startPauseBtn.textContent = 'PAUSE';
        settingsPanel.classList.add('hidden');
        requestWakeLock();

        if (remainingWhenPaused > 0) {
          phaseEndTime = Date.now() + remainingWhenPaused;
          remainingWhenPaused = 0;
          speak('再開');
        } else {
          startStep(0);
        }

        timerInterval = setInterval(tick, 100);
      } else {
        isRunning = false;
        clearInterval(timerInterval);
        remainingWhenPaused = phaseEndTime - Date.now();
        startPauseBtn.textContent = 'RESUME';
        releaseWakeLock();
        window.speechSynthesis.cancel();
      }
    });

    resetBtn.addEventListener('click', () => {
      isRunning = false;
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();
      releaseWakeLock();

      currentIndex = 0;
      remainingWhenPaused = 0;
      body.style.backgroundColor = 'var(--bg-idle)';
      statusLabel.textContent = 'READY';
      startPauseBtn.textContent = 'START';
      settingsPanel.classList.remove('hidden');
      updateIdleDisplay();
    });

    // 初期化
    loadExerciseList();
    renderPresetSelect();
    loadCurrentConfig();
  </script>
</body>
</html>
