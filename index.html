<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tabata & Run Tracker</title>
  <style>
    :root {
      --bg-idle: #121212;
      --bg-prep: #d97706;
      --bg-work: #dc2626;
      --bg-rest: #059669;
      --bg-done: #2563eb;
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-idle);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 18px;
      transition: background-color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: env(safe-area-inset-top);
    }

    .header-center {
      text-align: center;
      flex: 1;
    }

    .status-badge {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .set-indicator {
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-display {
      text-align: center;
      margin: 6px 0;
    }

    .exercise-banner {
      font-size: 1.55rem;
      font-weight: 800;
      min-height: 2.1rem;
      margin-bottom: 2px;
      padding: 0 6px;
      word-break: break-word;
    }

    .next-banner {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.85;
      min-height: 1.3rem;
      margin-bottom: 4px;
    }

    .time-left {
      font-size: 6.2rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 56dvh;
      overflow-y: auto;
    }

    .settings-container.hidden {
      display: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 11px 12px;
      backdrop-filter: blur(10px);
    }

    .preset-row {
      display: flex;
      gap: 8px;
    }

    .preset-row select {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preset-btn.danger {
      background: rgba(239, 68, 68, 0.35);
    }

    /* ラン距離・体重・セット数の3列グリッド */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .metric-box label {
      font-size: 0.72rem;
      opacity: 0.85;
      font-weight: 700;
      text-align: center;
    }

    .metric-box input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 4px;
      width: 100%;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.76rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .helper-text {
      font-size: 0.7rem;
      opacity: 0.75;
      line-height: 1.35;
    }

    .input-group textarea {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 10px;
      width: 100%;
      resize: none;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 12px;
      padding-bottom: env(safe-area-inset-bottom);
      margin-top: 8px;
    }

    .main-btn {
      flex: 1;
      padding: 15px;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #121212;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .info-bar {
      text-align: center;
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 5px;
    }

    /* 履歴モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      padding: 18px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-top: env(safe-area-inset-top);
    }

    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .summary-label {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .summary-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .history-meta {
      font-size: 0.76rem;
      opacity: 0.75;
      display: flex;
      justify-content: space-between;
    }

    .history-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 2px 0;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-run { background: rgba(16, 185, 129, 0.3); color: #6ee7b7; }
    .badge-weight { background: rgba(245, 158, 11, 0.3); color: #fcd34d; }
    .badge-tabata { background: rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .history-exercises {
      font-size: 0.8rem;
      opacity: 0.85;
      white-space: pre-line;
    }

    .history-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .load-history-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .del-history-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ccc;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div style="width: 60px;"></div>
    <div class="header-center">
      <div class="status-badge" id="statusLabel">READY</div>
      <div class="set-indicator" id="setLabel">SET 0 / 4</div>
    </div>
    <button class="icon-btn" id="openHistoryBtn">履歴</button>
  </header>

  <main class="timer-display">
    <div class="exercise-banner" id="exerciseBanner">準備</div>
    <div class="next-banner" id="nextBanner"></div>
    <div class="time-left" id="timeDisplay">10</div>
  </main>

  <section class="settings-container" id="settingsPanel">
    <!-- プリセット -->
    <div class="card">
      <div class="preset-row">
        <select id="presetSelect" aria-label="プリセット選択"></select>
        <button class="preset-btn" id="savePresetBtn">保存</button>
        <button class="preset-btn danger" id="deletePresetBtn">削除</button>
      </div>
    </div>

    <!-- ラン距離・体重・セット数 -->
    <div class="card metrics-grid">
      <div class="metric-box">
        <label for="runDistInput">ラン距離 (km)</label>
        <input type="number" id="runDistInput" step="0.1" min="0" max="100" placeholder="例: 4.0" inputmode="decimal">
      </div>
      <div class="metric-box">
        <label for="weightInput">体重 (kg)</label>
        <input type="number" id="weightInput" step="0.1" min="30" max="200" placeholder="例: 79.5" inputmode="decimal">
      </div>
      <div class="metric-box">
        <label for="roundsInput">セット数 (周)</label>
        <input type="number" id="roundsInput" value="4" min="1" max="99" inputmode="numeric">
      </div>
    </div>

    <!-- 自由シーケンス入力 -->
    <div class="card">
      <div class="input-group">
        <label for="sequenceInput">タバタ構成（1行に「種目, 秒数, 種類」を入力）</label>
        <textarea id="sequenceInput" rows="5">準備, 10, prep
バーピーブロードジャンプ, 20, work
レスト, 10, rest
スケータージャンプ, 20, work
レスト, 10, rest</textarea>
        <div class="helper-text">
          ※ 種類は <b>work</b>(運動)・<b>rest</b>(休憩)・<b>prep</b>(準備)。完了時にラン距離・体重も同時記録されます。
        </div>
      </div>
    </div>
  </section>

  <div>
    <div class="controls">
      <button class="main-btn btn-primary" id="startPauseBtn">START</button>
      <button class="main-btn btn-secondary" id="resetBtn">RESET</button>
    </div>
    <div class="info-bar" id="wakeLockStatus">画面常時点灯: 待機中</div>
  </div>

  <!-- 履歴モーダル -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-header">
      <h2>トレーニング＆体重記録</h2>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" style="background:#059669;" id="logRunOnlyBtn">+ ランのみ記録</button>
        <button class="icon-btn" id="closeHistoryBtn">閉じる</button>
      </div>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-label">今月の累計ラン距離</div>
        <div class="summary-value" id="monthlyRunSummary">0.0 km</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">最新体重（初回比）</div>
        <div class="summary-value" id="weightSummary">-- kg</div>
      </div>
    </div>

    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const body = document.body;
    const statusLabel = document.getElementById('statusLabel');
    const setLabel = document.getElementById('setLabel');
    const exerciseBanner = document.getElementById('exerciseBanner');
    const nextBanner = document.getElementById('nextBanner');
    const timeDisplay = document.getElementById('timeDisplay');
    const settingsPanel = document.getElementById('settingsPanel');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const wakeLockStatus = document.getElementById('wakeLockStatus');

    const runDistInput = document.getElementById('runDistInput');
    const weightInput = document.getElementById('weightInput');
    const roundsInput = document.getElementById('roundsInput');
    const sequenceInput = document.getElementById('sequenceInput');

    const presetSelect = document.getElementById('presetSelect');
    const savePresetBtn = document.getElementById('savePresetBtn');
    const deletePresetBtn = document.getElementById('deletePresetBtn');

    const openHistoryBtn = document.getElementById('openHistoryBtn');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const logRunOnlyBtn = document.getElementById('logRunOnlyBtn');
    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');
    const monthlyRunSummary = document.getElementById('monthlyRunSummary');
    const weightSummary = document.getElementById('weightSummary');

    const KEY_CURRENT = 'tabata_run_current_v3';
    const KEY_PRESETS = 'tabata_run_presets_v3';
    const KEY_HISTORY = 'tabata_run_history_v3';

    let executionQueue = [];
    let currentIndex = 0;
    let isRunning = false;
    let phaseEndTime = 0;
    let remainingWhenPaused = 0;
    let lastSpokenSecond = null;
    let timerInterval = null;
    let wakeLock = null;

    function setupAudioSession() {
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch (e) {}
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.2;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLockStatus.textContent = '画面常時点灯: ON';
          wakeLock.addEventListener('release', () => {
            wakeLockStatus.textContent = '画面常時点灯: OFF';
          });
        } catch (err) {
          wakeLockStatus.textContent = '画面常時点灯: 制限中';
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
        await requestWakeLock();
      }
    });

    function parseSequenceText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const steps = [];
      for (const line of lines) {
        const parts = line.split(/[,、]/).map(p => p.trim());
        const name = parts[0] || '運動';
        const sec = parseInt(parts[1], 10);
        if (isNaN(sec) || sec <= 0) continue;

        const rawType = (parts[2] || '').toLowerCase();
        let type = 'work';
        if (rawType === 'rest' || rawType === 'r' || rawType === '休憩') {
          type = 'rest';
        } else if (rawType === 'prep' || rawType === 'p' || rawType === '準備' || rawType === 'アップ') {
          type = 'prep';
        } else if (!parts[2] && (name.includes('レスト') || name.includes('休憩'))) {
          type = 'rest';
        } else if (!parts[2] && (name.includes('アップ') || name.includes('準備'))) {
          type = 'prep';
        }
        steps.push({ name, sec, type });
      }
      return steps;
    }

    function buildFullQueue() {
      const baseSteps = parseSequenceText(sequenceInput.value);
      const rounds = Math.max(1, parseInt(roundsInput.value, 10) || 1);
      const queue = [];
      for (let r = 1; r <= rounds; r++) {
        baseSteps.forEach((step, idx) => {
          queue.push({
            ...step,
            round: r,
            totalRounds: rounds,
            stepInRound: idx + 1,
            stepsPerRound: baseSteps.length
          });
        });
      }
      return queue;
    }

    function getCurrentConfig() {
      return {
        runDist: runDistInput.value,
        weight: weightInput.value,
        rounds: parseInt(roundsInput.value, 10) || 4,
        sequence: sequenceInput.value
      };
    }

    function applyConfig(cfg) {
      if (cfg.runDist !== undefined) runDistInput.value = cfg.runDist;
      if (cfg.weight !== undefined) weightInput.value = cfg.weight;
      roundsInput.value = cfg.rounds ?? 4;
      sequenceInput.value = cfg.sequence ?? '';
      saveCurrentConfig();
      updateIdleDisplay();
    }

    function saveCurrentConfig() {
      localStorage.setItem(KEY_CURRENT, JSON.stringify(getCurrentConfig()));
    }

    function loadCurrentConfig() {
      const raw = localStorage.getItem(KEY_CURRENT);
      if (raw) {
        try {
          applyConfig(JSON.parse(raw));
          return;
        } catch (e) {}
      }
      updateIdleDisplay();
    }

    function updateIdleDisplay() {
      if (isRunning) return;
      const queue = buildFullQueue();
      const rounds = Math.max(1, parseInt(roundsInput.value, 10) || 1);
      setLabel.textContent = `SET 0 / ${rounds}`;
      if (queue.length > 0) {
        exerciseBanner.textContent = queue[0].name;
        timeDisplay.textContent = queue[0].sec;
        nextBanner.textContent = queue.length > 1 ? `次: ${queue[1].name} (${queue[1].sec}秒)` : '';
      } else {
        exerciseBanner.textContent = 'メニュー未入力';
        timeDisplay.textContent = '0';
        nextBanner.textContent = '';
      }
    }

    [runDistInput, weightInput, roundsInput, sequenceInput].forEach(el => {
      el.addEventListener('input', () => {
        saveCurrentConfig();
        updateIdleDisplay();
      });
    });

    // ホッケー＆HYROX向け初期プリセット
    function getPresets() {
      const raw = localStorage.getItem(KEY_PRESETS);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      return [
        {
          id: 'day_a',
          name: 'Day A: HYROX＆ホッケー全身パワー (4分)',
          rounds: 4,
          sequence: 'バーピーブロードジャンプ, 20, work\nレスト, 10, rest\nスケータージャンプ, 20, work\nレスト, 10, rest'
        },
        {
          id: 'day_b',
          name: 'Day B: スプリント＆脚筋持久力 (15s/15s×4周)',
          rounds: 4,
          sequence: '30mシャトルダッシュ, 15, work\nレスト, 15, rest\nジャンピングランジ, 15, work\nレスト, 15, rest'
        },
        {
          id: 'day_c',
          name: 'Day C: 低衝撃・体幹＆脂肪燃焼 (4分)',
          rounds: 4,
          sequence: 'マウンテンクライマー, 20, work\nレスト, 10, rest\nプランクジャック, 20, work\nレスト, 10, rest'
        },
        {
          id: 'custom_sprint',
          name: 'アップ5s→ダッシュ10s→バーピー10s (×3)',
          rounds: 3,
          sequence: 'アップ, 5, prep\nダッシュ, 10, work\nレスト, 5, rest\nバーピー, 10, work\nレスト, 5, rest'
        }
      ];
    }

    function savePresets(list) {
      localStorage.setItem(KEY_PRESETS, JSON.stringify(list));
    }

    function renderPresetSelect(selectedId = null) {
      const presets = getPresets();
      presetSelect.innerHTML = '<option value="">-- 競技メニューから選択 --</option>';
      presets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        if (p.id === selectedId) opt.selected = true;
        presetSelect.appendChild(opt);
      });
    }

    presetSelect.addEventListener('change', () => {
      const found = getPresets().find(p => p.id === presetSelect.value);
      if (found) {
        // ラン距離と体重は現在の入力値を維持しつつメニューだけ読み込む
        roundsInput.value = found.rounds;
        sequenceInput.value = found.sequence;
        saveCurrentConfig();
        updateIdleDisplay();
      }
    });

    savePresetBtn.addEventListener('click', () => {
      const name = prompt('プリセット名を入力してください');
      if (!name || !name.trim()) return;
      const presets = getPresets();
      const newPreset = {
        id: 'preset_' + Date.now(),
        name: name.trim(),
        rounds: parseInt(roundsInput.value, 10) || 4,
        sequence: sequenceInput.value
      };
      presets.push(newPreset);
      savePresets(presets);
      renderPresetSelect(newPreset.id);
    });

    deletePresetBtn.addEventListener('click', () => {
      const id = presetSelect.value;
      if (!id) return alert('削除するプリセットを選択してください。');
      if (!confirm('選択中のプリセットを削除しますか？')) return;
      savePresets(getPresets().filter(p => p.id !== id));
      renderPresetSelect();
    });

    // 履歴の取得・保存
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]'); } catch (e) { return []; }
    }

    function saveHistoryList(list) {
      localStorage.setItem(KEY_HISTORY, JSON.stringify(list.slice(0, 100)));
    }

    function recordHistory(queue, isRunOnly = false) {
      const now = new Date();
      const totalSec = isRunOnly ? 0 : queue.reduce((acc, item) => acc + item.sec, 0);
      const cfg = getCurrentConfig();
      const distVal = parseFloat(cfg.runDist);
      const weightVal = parseFloat(cfg.weight);

      const entry = {
        id: Date.now(),
        timestamp: now.getTime(),
        yearMonth: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`,
        date: now.toLocaleString('ja-JP', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }),
        isRunOnly,
        totalSec,
        runDist: !isNaN(distVal) && distVal > 0 ? distVal : null,
        weight: !isNaN(weightVal) && weightVal > 0 ? weightVal : null,
        rounds: cfg.rounds,
        config: cfg
      };

      const history = getHistory();
      history.unshift(entry);
      saveHistoryList(history);

      // 記録後、次回の誤重複を防ぐためラン距離欄だけクリア（体重は前回値を残す）
      runDistInput.value = '';
      saveCurrentConfig();
    }

    logRunOnlyBtn.addEventListener('click', () => {
      const distVal = parseFloat(runDistInput.value);
      const weightVal = parseFloat(weightInput.value);
      if ((isNaN(distVal) || distVal <= 0) && (isNaN(weightVal) || weightVal <= 0)) {
        alert('メイン画面の「ラン距離」または「体重」に数値を入力してから押してください。');
        return;
      }
      recordHistory([], true);
      renderHistoryModal();
    });

    function renderHistoryModal() {
      const history = getHistory();
      const now = new Date();
      const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      // 今月の累計ラン距離計算
      const monthlyKm = history
        .filter(h => h.yearMonth === currentYM && h.runDist)
        .reduce((sum, h) => sum + h.runDist, 0);
      monthlyRunSummary.textContent = `${monthlyKm.toFixed(1)} km`;

      // 体重推移計算（最新 vs 最古）
      const weightEntries = history.filter(h => h.weight !== null);
      if (weightEntries.length > 0) {
        const latestW = weightEntries[0].weight;
        const oldestW = weightEntries[weightEntries.length - 1].weight;
        const diff = (latestW - oldestW).toFixed(1);
        const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
        weightSummary.textContent = weightEntries.length > 1
          ? `${latestW.toFixed(1)}kg (${diffStr}kg)`
          : `${latestW.toFixed(1)}kg`;
      } else {
        weightSummary.textContent = '-- kg';
      }

      if (history.length === 0) {
        historyList.innerHTML = '<div style="opacity:0.7; text-align:center; margin-top:40px;">まだ記録がありません。</div>';
        return;
      }

      historyList.innerHTML = '';
      history.forEach(item => {
        const min = Math.floor(item.totalSec / 60);
        const sec = item.totalSec % 60;
        const durationStr = min > 0 ? `${min}分${sec}秒` : `${sec}秒`;

        let badgesHtml = '';
        if (item.runDist) badgesHtml += `<span class="badge badge-run">🏃 ラン ${item.runDist} km</span>`;
        if (item.weight) badgesHtml += `<span class="badge badge-weight">⚖️ 体重 ${item.weight} kg</span>`;
        if (!item.isRunOnly) badgesHtml += `<span class="badge badge-tabata">🔥 タバタ ${item.rounds}周 (${durationStr})</span>`;

        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-meta"><span>${item.date}</span></div>
          <div class="history-badges">${badgesHtml}</div>
          ${!item.isRunOnly ? `<div class="history-exercises">${item.config.sequence}</div>` : ''}
          <div class="history-actions">
            ${!item.isRunOnly ? `<button class="load-history-btn">このメニューを読み込む</button>` : ''}
            <button class="del-history-btn">削除</button>
          </div>
        `;

        const loadBtn = div.querySelector('.load-history-btn');
        if (loadBtn) {
          loadBtn.addEventListener('click', () => {
            if (isRunning) return alert('タイマー実行中は読み込めません。');
            roundsInput.value = item.config.rounds;
            sequenceInput.value = item.config.sequence;
            saveCurrentConfig();
            updateIdleDisplay();
            presetSelect.value = '';
            historyModal.classList.remove('open');
          });
        }

        div.querySelector('.del-history-btn').addEventListener('click', () => {
          if (!confirm('この履歴を削除しますか？')) return;
          saveHistoryList(getHistory().filter(h => h.id !== item.id));
          renderHistoryModal();
        });

        historyList.appendChild(div);
      });
    }

    openHistoryBtn.addEventListener('click', () => {
      renderHistoryModal();
      historyModal.classList.add('open');
    });

    closeHistoryBtn.addEventListener('click', () => {
      historyModal.classList.remove('open');
    });

    function startStep(index) {
      if (index >= executionQueue.length) {
        isRunning = false;
        clearInterval(timerInterval);
        releaseWakeLock();
        recordHistory(executionQueue, false);

        body.style.backgroundColor = 'var(--bg-done)';
        statusLabel.textContent = 'FINISH';
        exerciseBanner.textContent = 'COMPLETE!';
        nextBanner.textContent = '履歴に自動記録しました';
        timeDisplay.textContent = '0';
        startPauseBtn.textContent = 'START';
        settingsPanel.classList.remove('hidden');
        speak('お疲れ様でした。トレーニング終了です');
        return;
      }

      currentIndex = index;
      lastSpokenSecond = null;
      const step = executionQueue[index];
      const nextStep = executionQueue[index + 1];

      if (step.type === 'prep') {
        body.style.backgroundColor = 'var(--bg-prep)';
        statusLabel.textContent = 'PREPARE';
      } else if (step.type === 'rest') {
        body.style.backgroundColor = 'var(--bg-rest)';
        statusLabel.textContent = 'REST';
      } else {
        body.style.backgroundColor = 'var(--bg-work)';
        statusLabel.textContent = 'WORK';
      }

      setLabel.textContent = `SET ${step.round} / ${step.totalRounds}`;
      exerciseBanner.textContent = step.name;
      nextBanner.textContent = nextStep ? `次: ${nextStep.name} (${nextStep.sec}秒)` : 'これが最後のメニューです';

      let speechText = '';
      if (step.type === 'rest') {
        speechText = nextStep ? `${step.name}。次は、${nextStep.name}` : step.name;
      } else if (step.type === 'prep') {
        speechText = nextStep ? `${step.name}、${step.sec}秒。次は、${nextStep.name}` : `${step.name}、${step.sec}秒`;
      } else {
        const isLastWork = !executionQueue.slice(index + 1).some(s => s.type === 'work');
        speechText = isLastWork ? `ラスト、${step.name}、スタート` : `${step.name}、スタート`;
      }
      speak(speechText);

      phaseEndTime = Date.now() + step.sec * 1000;
      timeDisplay.textContent = step.sec;
    }

    function tick() {
      const now = Date.now();
      const diffMs = phaseEndTime - now;
      const secLeft = Math.ceil(diffMs / 1000);

      if (secLeft > 0) {
        timeDisplay.textContent = secLeft;
        const currentStepSec = executionQueue[currentIndex].sec;
        const countdownStart = Math.min(3, currentStepSec - 1);
        if (secLeft <= countdownStart && secLeft !== lastSpokenSecond) {
          lastSpokenSecond = secLeft;
          if (secLeft === 3) {
            speak('残り3秒');
          } else {
            speak(String(secLeft));
          }
        }
      } else {
        startStep(currentIndex + 1);
      }
    }

    startPauseBtn.addEventListener('click', () => {
      setupAudioSession();

      if (!isRunning) {
        if (remainingWhenPaused === 0) {
          executionQueue = buildFullQueue();
          if (executionQueue.length === 0) {
            alert('メニュー構成を1行以上入力してください。');
            return;
          }
          const unlock = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(unlock);
        }

        isRunning = true;
        startPauseBtn.textContent = 'PAUSE';
        settingsPanel.classList.add('hidden');
        requestWakeLock();

        if (remainingWhenPaused > 0) {
          phaseEndTime = Date.now() + remainingWhenPaused;
          remainingWhenPaused = 0;
          speak('再開');
        } else {
          startStep(0);
        }

        timerInterval = setInterval(tick, 100);
      } else {
        isRunning = false;
        clearInterval(timerInterval);
        remainingWhenPaused = phaseEndTime - Date.now();
        startPauseBtn.textContent = 'RESUME';
        releaseWakeLock();
        window.speechSynthesis.cancel();
      }
    });

    resetBtn.addEventListener('click', () => {
      isRunning = false;
      clearInterval(timerInterval);
      window.speechSynthesis.cancel();
      releaseWakeLock();

      currentIndex = 0;
      remainingWhenPaused = 0;
      body.style.backgroundColor = 'var(--bg-idle)';
      statusLabel.textContent = 'READY';
      startPauseBtn.textContent = 'START';
      settingsPanel.classList.remove('hidden');
      updateIdleDisplay();
    });

    // 初期化
    renderPresetSelect();
    loadCurrentConfig();
  </script>
</body>
</html>
